backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "playbook"
    label: "Playbook de Vendas"
    files:
      - name: "conteudo"
        label: "Conteúdo Geral"
        file: "content/playbook.json"
        fields:

          # =========================
          # QUEM SOMOS
          # =========================
          - label: "Quem Somos – Texto principal"
            name: "quem_somos_texto"
            widget: "text"

          - label: "Quem Somos – Frase de impacto"
            name: "quem_somos_frase"
            widget: "string"

          # =========================
          # ICP
          # =========================
          - label: "ICP – Descrição"
            name: "icp_descricao"
            widget: "text"

          - label: "ICP – Sinais de lead quente"
            name: "icp_leads_quentes"
            widget: "list"
            allow_add: true
            field:
              label: "Frase"
              name: "frase"
              widget: "string"

          # =========================
          # PROCESSO
          # =========================
          - label: "Processo – Introdução"
            name: "processo_intro"
            widget: "text"

          - label: "Processo – Etapas"
            name: "processo_etapas"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "text" }

          # =========================
          # ABORDAGEM
          # =========================
          - label: "Abordagem – Texto principal"
            name: "abordagem_texto"
            widget: "text"

          - label: "Script WhatsApp"
            name: "script_whatsapp"
            widget: "text"

          - label: "Script Email"
            name: "script_email"
            widget: "text"

          # =========================
          # PROPOSTAS
          # =========================
          - label: "Propostas – Introdução"
            name: "propostas_intro"
            widget: "text"

          - label: "Checklist de Proposta"
            name: "checklist_proposta"
            widget: "list"
            field:
              label: "Item"
              name: "item"
              widget: "string"

          # =========================
          # FOLLOW-UP
          # =========================
          - label: "Follow-up – Cadência"
            name: "followup_cadencia"
            widget: "list"
            field:
              label: "Etapa"
              name: "etapa"
              widget: "string"

          - label: "Follow-up – Mensagens"
            name: "followup_mensagens"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }

          # =========================
          # SPAM OFFERS
          # =========================
          - label: "Spam Offer – Explicação"
            name: "spam_intro"
            widget: "text"

          - label: "Spam Offer – Exemplos"
            name: "spam_exemplos"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "text" }

          # =========================
          # SCRIPTS & OBJEÇÕES
          # =========================
          - label: "Objeções – Lista"
            name: "objecoes"
            widget: "list"
            fields:
              - { label: "Objeção", name: "objecao", widget: "string" }
              - { label: "Resposta sugerida", name: "resposta", widget: "text" }

          # =========================
          # CHECKLIST & KPIs
          # =========================
          - label: "Checklist Diário"
            name: "checklist_diario"
            widget: "list"
            field:
              label: "Item"
              name: "item"
              widget: "string"

          - label: "KPIs"
            name: "kpis"
            widget: "list"
            field:
              label: "Indicador"
              name: "indicador"
              widget: "string"
